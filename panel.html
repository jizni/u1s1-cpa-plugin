<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>u1s1 额度面板</title>
<style>
/* Theme tokens aligned with the CPA management panel:
   default :root = light (paper); data-theme=white | dark. Embedded iframes
   mirror the parent's data-theme, so there is no panel-local theme switch. */
:root{
  --bg:#faf9f5;--card:#ffffff;--border:#e3e1db;--fg:#2d2a26;--mut:#6d6760;
  --acc:#4c8dff;--on-acc:#ffffff;--ok:#10b981;--warn:#e0aa14;--err:#c65746;
  --surface:#f0eee8;--surface-muted:#e9e6df;--btn-sec:#eef1f6;--btn-sec-hover:#e4e8ef;
  --input-bg:#ffffff;--placeholder:rgba(109,103,96,.55);--track:#e9e6df;
  --err-soft:rgba(198,87,70,.10);--err-border:rgba(198,87,70,.30);
  --mut-soft:rgba(109,103,96,.12);--mut-border:rgba(109,103,96,.28);
  --acc-ring:rgba(76,141,255,.18);
  color-scheme:light
}
:root[data-theme="white"]{
  --bg:#f5f5f5;--card:#ffffff;--border:#e6e6e6;--fg:#1f1f1f;--mut:#707070;
  --surface:#fafafa;--surface-muted:#efefef;--btn-sec:#f0f0f0;--btn-sec-hover:#e8e8e8;
  --input-bg:#ffffff;--placeholder:rgba(112,112,112,.55);--track:#e6e6e6;
  color-scheme:light
}
:root[data-theme="dark"]{
  --bg:#1e1d1b;--card:#26241f;--border:#3a3833;--fg:#ede9e3;--mut:#9a948c;
  --acc:#4c8dff;--on-acc:#ffffff;--ok:#34d399;--warn:#f0c050;--err:#e07a6a;
  --surface:#2f2d28;--surface-muted:#35332e;--btn-sec:#35332e;--btn-sec-hover:#3f3c36;
  --input-bg:#1e1d1b;--placeholder:rgba(154,148,140,.55);--track:#35332e;
  --err-soft:rgba(224,122,106,.12);--err-border:rgba(224,122,106,.38);
  --mut-soft:rgba(154,148,140,.16);--mut-border:rgba(154,148,140,.32);
  --acc-ring:rgba(76,141,255,.28);
  color-scheme:dark
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
     font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:24px 16px}
h1{font-size:20px;margin:0 0 4px;font-weight:600}
.sub{color:var(--mut);font-size:13px;margin-bottom:16px}
/* Toolbar sits in normal flow under the title so host-panel chrome in the
   top-right corner can never overlap it. */
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.bar .stamp{color:var(--mut);font-size:12px;margin-left:2px}
button{background:var(--acc);color:var(--on-acc);border:0;border-radius:8px;
       padding:8px 14px;cursor:pointer;font-size:13px}
button.sec{background:var(--btn-sec);color:var(--fg)}
button.sec:hover{background:var(--btn-sec-hover)}
button:disabled{opacity:.5;cursor:default}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;
      padding:16px 18px;margin-bottom:14px}
.acct-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.acct-email{font-size:15px;font-weight:600}
.tag{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--mut-border);
     background:var(--mut-soft);color:var(--mut)}
.tag.off{color:var(--err);border-color:var(--err-border);background:var(--err-soft)}
.mut{color:var(--mut);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.kv{background:var(--surface);border-radius:10px;padding:10px 12px}
.kv .k{font-size:11px;color:var(--mut);margin-bottom:3px}
.kv .v{font-size:15px;font-variant-numeric:tabular-nums;font-weight:600}
.kv .v.sm{font-size:13px;font-weight:500}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top}
th{font-size:11px;color:var(--mut);font-weight:500;letter-spacing:.03em;text-transform:uppercase}
td.num,th.num{text-align:right}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
.bar-track{height:6px;background:var(--track);border-radius:99px;overflow:hidden;margin-top:5px;min-width:90px}
.bar-track>i{display:block;height:100%;background:var(--ok);border-radius:99px}
.bar-track.low>i{background:var(--warn)}
.bar-track.crit>i{background:var(--err)}
.note{font-size:11px;color:var(--mut);margin-top:3px}
.usage-package-count{font-size:11px;color:var(--mut);border:1px solid var(--border);border-radius:999px;padding:0 6px;margin-left:4px;vertical-align:middle}
.usage-package-note{color:var(--mut);padding-top:0}
.err{color:var(--err)}
.tag.claim{color:var(--ok);border-color:var(--ok);background:transparent}
.login{max-width:440px}
.login input{width:100%;padding:9px 11px;border-radius:8px;border:1px solid var(--border);
             background:var(--input-bg);color:var(--fg);font-size:13px;margin:10px 0}
.login input::placeholder{color:var(--placeholder)}
.hint{font-size:12px;color:var(--mut);margin-top:8px}
code{background:var(--surface-muted);padding:1px 5px;border-radius:4px;font-size:12px}
</style>
<script>
/* Early theme sync (runs before first paint): mirror the CPA parent's
   data-theme when embedded, else follow the OS preference. The DOM attribute is
   the single source of truth — this panel owns no theme setting of its own. */
(function(){
  var ATTR="data-theme";
  function embedded(){try{return window.self!==window.top}catch(e){return false}}
  function apply(t){
    var el=document.documentElement;
    if(t==="white"||t==="dark")el.setAttribute(ATTR,t);
    else el.removeAttribute(ATTR);
  }
  function parentTheme(){
    if(!embedded())return null;
    try{
      var raw=window.parent.document.documentElement.getAttribute(ATTR);
      if(raw==="white"||raw==="dark")return raw;
      return "light";
    }catch(e){return null}
  }
  function systemTheme(){
    try{return window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"}
    catch(e){return "light"}
  }
  function sync(){apply(parentTheme()||systemTheme())}
  sync();
  window.__u1s1ThemeSync=function(){
    sync();
    if(!embedded()){
      try{
        var mq=window.matchMedia("(prefers-color-scheme: dark)");
        if(mq.addEventListener)mq.addEventListener("change",sync);
        else if(mq.addListener)mq.addListener(sync);
      }catch(e){}
      return;
    }
    try{
      new MutationObserver(sync).observe(window.parent.document.documentElement,
        {attributes:true,attributeFilter:[ATTR]});
      window.addEventListener("storage",function(e){if(e.key==="cli-proxy-theme")sync()});
    }catch(e){}
  };
})();
</script>
</head>
<body>
<div class="wrap">
  <h1>u1s1 额度</h1>
  <div class="sub">今日免费额度 · 余额(按量) · 用量包明细（与 <code>u1s1 usage</code> 一致）</div>
  <div class="bar">
    <button id="reload">刷新</button>
    <button id="diag" class="sec">最近错误</button>
    <button id="checkin" class="sec">签到</button>
    <span id="stamp" class="stamp" role="status" aria-live="polite"></span>
  </div>
  <div id="root"><p class="mut">加载中…</p></div>
</div>

<script>
const MANAGEMENT_BASE_PATH = __U1S1_MANAGEMENT_BASE_PATH_JSON__;

/* ---- management key acquisition ----------------------------------------
   The resource page itself is unauthenticated; every data call goes to the
   authenticated management route. Key sources, in order:
     1) ?key= in the URL (moved into sessionStorage, scrubbed from history)
     2) sessionStorage (manual entry, never persisted to disk)
     3) the CPA console's localStorage, readable only when this page is
        embedded same-origin in that console
   ------------------------------------------------------------------------ */
const SS_KEY = "u1s1-mgmt-key";
const PANEL_STORE = "cli-proxy-auth";
const ENC_PREFIX = "enc::v1::";
const SECRET_SALT = "cli-proxy-api-webui::secure-storage";
let keySuppressed = false;

const readSessionKey = () => { if (keySuppressed) return null; try { return sessionStorage.getItem(SS_KEY); } catch { return null; } };
const storeSessionKey = k => { try { sessionStorage.setItem(SS_KEY, k); keySuppressed = false; return true; } catch { return false; } };
const clearSessionKey = () => { keySuppressed = true; try { sessionStorage.removeItem(SS_KEY); } catch {} };

const encBytes = t => new TextEncoder().encode(t);
const decBytes = b => new TextDecoder().decode(b);
const keyBytes = () => { try { return encBytes(SECRET_SALT + "|" + location.host + "|" + navigator.userAgent); } catch { return encBytes(SECRET_SALT); } };
const xorBytes = (d, k) => { const r = new Uint8Array(d.length); for (let i = 0; i < d.length; i++) r[i] = d[i] ^ k[i % k.length]; return r; };
const b64dec = s => { const bin = atob(s); const b = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) b[i] = bin.charCodeAt(i); return b; };
const deobfuscate = p => { if (!p || !p.startsWith(ENC_PREFIX)) return p; try { return decBytes(xorBytes(b64dec(p.slice(ENC_PREFIX.length)), keyBytes())); } catch { return p; } };
const isEmbedded = () => { try { return window.self !== window.top; } catch { return false; } };

function readConsoleKey() {
  if (!isEmbedded()) return null;
  let raw; try { raw = localStorage.getItem(PANEL_STORE); } catch { return null; }
  if (!raw) return null;
  try {
    const parsed = JSON.parse(deobfuscate(raw));
    const st = (parsed && parsed.state) || parsed || {};
    return typeof st.managementKey === "string" && st.managementKey ? st.managementKey : null;
  } catch { return null; }
}

(function captureUrlKey() {
  const url = new URL(location.href);
  const k = url.searchParams.get("key");
  if (!k) return;
  try { if (!storeSessionKey(k)) clearSessionKey(); } finally {
    url.searchParams.delete("key");
    history.replaceState(null, "", url.pathname + url.search + url.hash);
  }
})();

const getKey = () => keySuppressed ? null : (readSessionKey() || readConsoleKey());

/* ---- formatting -------------------------------------------------------- */
// The dashboard is where a claimable free package is actually claimed (the claim
// endpoint needs a browser session plus two captchas). The panel links there for
// that reason only — it is a quota readout, not a place to advertise top-ups.
const DASHBOARD_URL = "https://u1s1.io/dashboard";
const usd = n => "$" + (Number(n) || 0).toFixed(2);
// Matches the CLI's 万/亿 formatting so numbers line up with `u1s1 usage`.
function tokens(n) {
  const t = Number(n) || 0;
  if (t <= 0) return "0";
  if (t >= 1e8) return (Math.round(t / 1e8 * 10) / 10).toLocaleString("en-US") + " 亿";
  if (t >= 1e4) {
    const w = t / 1e4;
    const m = Math.pow(10, Math.max(0, String(Math.round(w)).length - 2));
    return (Math.round(w / m) * m).toLocaleString("en-US") + " 万";
  }
  return Math.round(t).toLocaleString("en-US");
}
// The CLI leads with Token counts because that is the unit quota packages are
// denominated in; USD is the conversion. tokens_per_usd is absent on older
// gateways, and then only the dollar figure is meaningful.
function moneyCell(a, amount) {
  const tpu = Number(a.tokens_per_usd) || 0;
  return tpu > 0
    ? { value: tokens((Number(amount) || 0) * tpu) + " Token", note: usd(amount) }
    : { value: usd(amount), note: "" };
}
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
// Mirrors the dashboard's mergePkgs expiry presentation: a single expiry date
// renders plainly; a group with several shows the earliest plus a note that
// the rest expire in batches (or never).
function packageExpiryText(p) {
  const dates = [...(p.expiry_dates || [])].sort();
  if (dates.length === 0) return "永不过期";
  const first = dates[0].slice(0, 10);
  if (dates.length === 1 && !p.has_never_expiring) return first + " 到期";
  return p.has_never_expiring
    ? `最早 ${first} 到期 · 含永不过期额度`
    : `最早 ${first} 到期 · 分批到期`;
}
function localTime(s) {
  if (!s) return "—";
  const d = new Date(s.includes("T") ? s : s.replace(" ", "T") + "Z");
  return isNaN(d) ? esc(s) : d.toLocaleString();
}
function meter(remaining, total) {
  if (!total || total <= 0) return "";
  const pct = Math.max(0, Math.min(100, remaining / total * 100));
  const cls = pct <= 10 ? "bar-track crit" : pct <= 30 ? "bar-track low" : "bar-track";
  return `<div class="${cls}"><i style="width:${pct.toFixed(1)}%"></i></div>`;
}

/* ---- data -------------------------------------------------------------- */
async function callAPI(path, opts = {}) {
  const k = getKey();
  if (!k) { const e = new Error("missing management key"); e.needKey = true; throw e; }
  const r = await fetch(MANAGEMENT_BASE_PATH + path, {
    ...opts, credentials: "omit",
    headers: { ...(opts.headers || {}), Authorization: "Bearer " + k }
  });
  if (r.status === 401 || r.status === 403) { clearSessionKey(); const e = new Error("management key rejected"); e.needKey = true; throw e; }
  if (!r.ok) {
    let msg = "HTTP " + r.status;
    try { const j = await r.json(); if (j && j.error) msg = j.error; } catch {}
    throw new Error(msg);
  }
  return r.json();
}

function renderLogin(msg) {
  document.getElementById("root").innerHTML = `
    <div class="card login">
      <div style="font-weight:600;margin-bottom:4px">需要管理密钥</div>
      ${msg ? `<div class="err" style="font-size:12px">${esc(msg)}</div>` : ""}
      <input id="keyin" type="password" placeholder="management key" autocomplete="off">
      <button id="keygo">进入</button>
      <div class="hint">密钥只存在本页会话里，不会写入磁盘。从 CPA 管理台内嵌打开时自动获取，无需输入。</div>
    </div>`;
  const go = () => {
    const v = document.getElementById("keyin").value.trim();
    if (!v) return;
    if (!storeSessionKey(v)) { renderLogin("无法写入 sessionStorage"); return; }
    load();
  };
  document.getElementById("keygo").onclick = go;
  document.getElementById("keyin").onkeydown = e => { if (e.key === "Enter") go(); };
}

function renderAccount(a) {
  if (a.error) {
    return `<div class="card">
      <div class="acct-head"><span class="acct-email">${esc(a.email || a.label || a.name)}</span>
      <span class="tag off">读取失败</span></div>
      <div class="err">${esc(a.error)}</div></div>`;
  }

  const rows = (a.packages || []).map(p => {
    const cap = p.daily_tokens || p.total_tokens || 0;
    const capLabel = p.daily_tokens ? tokens(p.daily_tokens) + " / 天" : p.total_tokens ? tokens(p.total_tokens) : "—";
    const countBadge = (p.count || 1) > 1 ? ` <span class="usage-package-count">× ${p.count}</span>` : "";
    const grantNote = p.kind === "admin_grant" && String(p.note || "").trim()
      ? `<tr><td colspan="5" class="note usage-package-note">${esc(String(p.note).trim())}</td></tr>`
      : "";
    return `<tr>
      <td>${esc(p.kind_label)}${countBadge}<div class="note">${esc(p.scope_note)}</div></td>
      <td class="num">${tokens(p.remaining)}${meter(p.remaining, cap)}</td>
      <td class="num">${capLabel}</td>
      <td class="num">${tokens(p.used_today)}</td>
      <td>${packageExpiryText(p)}</td>
    </tr>` + grantNote;
  }).join("");

  const freePct = a.daily_free_usd > 0 ? a.daily_free_remaining_usd / a.daily_free_usd * 100 : 0;
  const free = moneyCell(a, a.daily_free_remaining_usd);
  const balance = moneyCell(a, a.bonus_balance_usd);
  const monthly = moneyCell(a, a.mtd_usd);
  // A claimable free package is only claimable on the website: the claim endpoint
  // needs a browser session plus two captchas, so link there instead of a button.
  const claim = a.free_claim
    ? `<a class="tag claim" href="${DASHBOARD_URL}" target="_blank" rel="noopener noreferrer">${
        a.free_claim === "first" ? "有免费用量包可领" : "免费用量包可续"}</a>`
    : "";
  return `<div class="card">
    <div class="acct-head">
      <span class="acct-email">${esc(a.email || a.label || a.name)}</span>
      ${a.disabled ? '<span class="tag off">已停用</span>' : `<span class="tag">${esc(a.status || "active")}</span>`}
      ${claim}
      <span class="mut">${esc(a.name)}</span>
    </div>
    <div class="grid">
      <div class="kv"><div class="k">今日免费剩余</div><div class="v">${free.value}</div>
        ${meter(a.daily_free_remaining_usd, a.daily_free_usd)}
        <div class="note">共 ${usd(a.daily_free_usd)} · ${freePct.toFixed(1)}%</div></div>
      <div class="kv"><div class="k">余额(按量)</div><div class="v">${balance.value}</div>
        <div class="note">${[balance.note, a.bonus_balance_usd ? `含赠送 ${usd(a.bonus_balance_usd)}` : ""].filter(Boolean).join(" · ")}</div></div>
      <div class="kv"><div class="k">本月已用</div><div class="v">${monthly.value}</div>
        ${monthly.note ? `<div class="note">${monthly.note}</div>` : ""}</div>
      <div class="kv"><div class="k">包内剩余 Token</div><div class="v">${tokens(a.total_remaining_tokens)}</div>
        <div class="note">今日已用 ${tokens(a.total_used_today)}</div></div>
      <div class="kv"><div class="k">额度重置</div><div class="v sm">${localTime(a.daily_free_resets_at)}</div>
        <div class="note">计价模型 ${esc(a.daily_free_model || "—")}</div></div>
    </div>
    ${rows ? `<table><thead><tr>
        <th>用量包</th><th class="num">剩余</th><th class="num">额度</th>
        <th class="num">今日已用</th><th>到期</th>
      </tr></thead><tbody>${rows}</tbody></table>` : '<div class="mut">没有用量包。</div>'}
    <div class="note">免费用量包覆盖 DeepSeek V4 Flash / Vision、GLM-5.3 Flash、Qwen3.8 Flash 和联网搜索；
      其他模型（如 DeepSeek V4 Pro）不走免费包，可用余额或全模型包。
      Token 数按默认模型单价折算，为约数；用更贵的模型时消耗更快。</div>
  </div>`;
}

let loading = false;

async function load(force) {
  // Guard re-entry: the button is disabled below, but Enter in the key form and
  // the initial load can both reach here.
  if (loading) return;
  loading = true;
  const root = document.getElementById("root");
  const btn = document.getElementById("reload");
  const label = btn.textContent;
  // A forced refresh that finds unchanged quota numbers is indistinguishable
  // from a dead button, so say out loud that the click was taken.
  btn.textContent = "刷新中…";
  btn.disabled = true;
  if (force) document.getElementById("stamp").textContent = "正在读取 /v1/me…";
  try {
    const data = force
      ? await callAPI("/plugins/u1s1/refresh", { method: "POST" })
      : await callAPI("/plugins/u1s1/usage");
    const accounts = data.accounts || [];
    document.getElementById("stamp").textContent = data.fetched_at ? "更新于 " + localTime(data.fetched_at) : "";
    root.innerHTML = accounts.length
      ? accounts.map(renderAccount).join("")
      : '<div class="card"><div class="mut">没有 u1s1 凭证。用管理端 <code>/v0/management/u1s1-auth-url</code> 发起设备登录，或把 <code>~/.u1s1/config.json</code> 放进 auth-dir。</div></div>';
  } catch (e) {
    document.getElementById("stamp").textContent = "";
    if (e.needKey) renderLogin(e.message === "missing management key" ? "" : e.message);
    else root.innerHTML = `<div class="card err">加载失败：${esc(e.message)}</div>`;
  } finally {
    loading = false;
    btn.disabled = false;
    btn.textContent = label;
  }
}

/* ---- diagnostics ------------------------------------------------------- */
// The gateway mints a request_id for every failure and support looks requests up
// by it. It otherwise only appears in the error text of the one response that
// failed, which is gone by the time anyone asks.
function renderDiagnostics(data) {
  const rows = (data.errors || []).map(e => `<tr>
      <td>${localTime(e.at)}</td>
      <td class="num">${esc(e.status || "—")}</td>
      <td>${esc(e.code || "—")}</td>
      <td>${e.request_id ? `<code>${esc(e.request_id)}</code>` : "—"}</td>
      <td>${esc(e.message || "")}</td>
    </tr>`).join("");
  return `<div class="card">
    <div class="acct-head"><span class="acct-email">最近的上游错误</span>
      <span class="mut">插件 ${esc(data.plugin_version || "—")} · 客户端指纹 ${esc(data.client_version || "—")}</span></div>
    ${rows ? `<table><thead><tr>
        <th>时间</th><th class="num">HTTP</th><th>代号</th><th>请求编号</th><th>说明</th>
      </tr></thead><tbody>${rows}</tbody></table>`
      : '<div class="mut">重启以来没有上游错误。</div>'}
    <div class="note">报障时附上请求编号，客服可凭它直查网关日志。只保留最近 ${esc(data.max_records || 0)} 条，重启清空。</div>
  </div>`;
}

async function loadDiagnostics() {
  if (loading) return;
  loading = true;
  const root = document.getElementById("root");
  const btn = document.getElementById("diag");
  const label = btn.textContent;
  btn.textContent = "读取中…";
  btn.disabled = true;
  try {
    root.innerHTML = renderDiagnostics(await callAPI("/plugins/u1s1/diagnostics"));
    document.getElementById("stamp").textContent = "最近错误 · 点「刷新」回到额度";
  } catch (e) {
    if (e.needKey) renderLogin(e.message === "missing management key" ? "" : e.message);
    else root.innerHTML = `<div class="card err">加载失败：${esc(e.message)}</div>`;
  } finally {
    loading = false;
    btn.disabled = false;
    btn.textContent = label;
  }
}

document.getElementById("reload").onclick = () => load(true);
document.getElementById("diag").onclick = () => loadDiagnostics();

/* ---- daily login check-in -----------------------------------------------
   The claim endpoint lives on the website and needs a browser session cookie,
   which only the account owner can obtain (log in to u1s1.io, copy the
   Cookie). The plugin stores it next to the credential and claims twice a day
   at the configured Beijing-time slots. Without a cookie the panel shows a
   login prompt; with one it shows the last result and offers a manual run.
   ------------------------------------------------------------------------ */
const CHECKIN_URL = "https://u1s1.io/dashboard";

function renderCheckin(data) {
  const runTag = s => ({
    ok: ["已打卡", "tag"],
    already: ["今日已打", "tag"],
    no_cookie: ["未设置 Cookie", "tag off"],
    error: ["失败", "tag off"],
  }[s] || [s || "—", "tag"]);
  const cards = (data.accounts || []).map(a => {
    const [stLabel, stCls] = runTag(a.last_run ? a.last_run.status : "no_cookie");
    const last = a.last_run
      ? `${localTime(a.last_run.at)} · ${esc(a.last_run.message || "")}`
      : "从未运行";
    const needsLogin = a.needs_login || !a.cookie_set;
    return `<div class="card">
      <div class="acct-head">
        <span class="acct-email">${esc(a.email || a.name)}</span>
        ${needsLogin ? '<span class="tag off">需要登录</span>' : '<span class="tag">Cookie 已设置</span>'}
        <span class="tag ${stCls}">${stLabel}</span>
        <span class="mut">${esc(a.name)}</span>
      </div>
      ${needsLogin
        ? `<div class="hint">还没有网页会话 Cookie。用浏览器登录 <a href="${CHECKIN_URL}" target="_blank" rel="noopener noreferrer">u1s1.io</a> 后，把 Cookie 值粘贴到下方并保存；保存时插件会用 /api/me 验证有效性。</div>`
        : `<div class="note">Cookie ${esc(a.cookie_hint || "")} · 最近 ${last}</div>`}
      <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
        <input data-checkin-cookie="${esc(a.auth_index)}" type="password" placeholder="粘贴浏览器 Cookie（可留空=沿用已保存的）" autocomplete="off"
               style="flex:1;min-width:220px;padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--input-bg);color:var(--fg)">
        <button data-checkin-save="${esc(a.auth_index)}" class="sec">保存</button>
        <button data-checkin-run="${esc(a.auth_index)}">立即签到</button>
        ${a.cookie_set ? `<button data-checkin-clear="${esc(a.auth_index)}" class="sec">清除</button>` : ""}
      </div>
      <div class="note">每天可领 200 万 Token 全模型加量包（30 天有效）。自动签到在北京时间 ${esc(data.times || "—")} 执行${data.next_run ? `，下次 ${localTime(data.next_run)}` : ""}。</div>
    </div>`;
  }).join("");
  if (!cards) return '<div class="card"><div class="mut">没有 u1s1 凭证。</div></div>';
  return `<div class="card">
    <div class="acct-head"><span class="acct-email">每日登录打卡</span>
      <span class="mut">${data.enabled ? "自动签到已开启" : "自动签到已关闭（配置 checkin-enabled: false）"} · 站点 ${esc(data.web_origin || "")}</span></div>
  </div>` + cards;
}

async function loadCheckin() {
  if (loading) return;
  loading = true;
  const root = document.getElementById("root");
  const btn = document.getElementById("checkin");
  const label = btn.textContent;
  btn.textContent = "读取中…";
  btn.disabled = true;
  try {
    const data = await callAPI("/plugins/u1s1/checkin/status");
    root.innerHTML = renderCheckin(data);
    document.getElementById("stamp").textContent = "签到 · 点「刷新」回到额度";
    bindCheckinActions();
  } catch (e) {
    if (e.needKey) renderLogin(e.message === "missing management key" ? "" : e.message);
    else root.innerHTML = `<div class="card err">加载失败：${esc(e.message)}</div>`;
  } finally {
    loading = false;
    btn.disabled = false;
    btn.textContent = label;
  }
}

function bindCheckinActions() {
  const root = document.getElementById("root");
  const flash = (btn, text) => { const old = btn.textContent; btn.textContent = text; btn.disabled = true; setTimeout(() => { btn.textContent = old; btn.disabled = false; }, 2000); };
  root.querySelectorAll("[data-checkin-save]").forEach(btn => {
    btn.onclick = async () => {
      const ai = btn.getAttribute("data-checkin-save");
      const input = root.querySelector(`[data-checkin-cookie="${ai}"]`);
      const cookie = input ? input.value.trim() : "";
      if (!cookie) { flash(btn, "先粘贴 Cookie"); return; }
      flash(btn, "验证中…");
      try {
        await callAPI("/plugins/u1s1/checkin/cookie", { method: "POST", body: JSON.stringify({ auth_index: ai, cookie }) });
        loadCheckin();
      } catch (e) {
        flash(btn, e.message);
      }
    };
  });
  root.querySelectorAll("[data-checkin-clear]").forEach(btn => {
    btn.onclick = async () => {
      const ai = btn.getAttribute("data-checkin-clear");
      flash(btn, "清除中…");
      try {
        await callAPI("/plugins/u1s1/checkin/cookie?auth_index=" + encodeURIComponent(ai), { method: "DELETE" });
        loadCheckin();
      } catch (e) { flash(btn, e.message); }
    };
  });
  root.querySelectorAll("[data-checkin-run]").forEach(btn => {
    btn.onclick = async () => {
      const ai = btn.getAttribute("data-checkin-run");
      flash(btn, "签到中…");
      try {
        const data = await callAPI("/plugins/u1s1/checkin/run?auth_index=" + encodeURIComponent(ai), { method: "POST" });
        const r = (data.results || [])[0];
        flash(btn, r ? (r.message || r.status) : "完成");
        setTimeout(loadCheckin, 1500);
      } catch (e) { flash(btn, e.message); }
    };
  });
}

document.getElementById("checkin").onclick = () => loadCheckin();
if (window.__u1s1ThemeSync) window.__u1s1ThemeSync();
load();
</script>
