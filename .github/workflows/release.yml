name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    # Build inside a Debian 12 container: its glibc 2.36 matches the CPA
    # container exactly, so the artifact can never require newer symbols than
    # the target provides. The old ubuntu-22.04 runner pin (glibc 2.35 build
    # host) hit GitHub's deprecation window (unsupported from 2026-09-17); the
    # container approach is runner-agnostic and will survive any image swap.
    #
    # The glibc gate in scripts/glibc-check.sh still runs afterwards: a
    # version-ordered <= comparison that also accepts more-compatible builds
    # (glibc < 2.36) instead of an equality whitelist.
    runs-on: ubuntu-latest
    container:
      # node:22-bookworm = Debian 12 (glibc 2.36, identical to the CPA
      # container) plus the Node runtime the checkout/setup-go JS actions
      # need inside a container job.
      image: node:22-bookworm
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates binutils gcc libc6-dev

      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build (c-shared) with release version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          CGO_ENABLED=1 go build -buildmode=c-shared -trimpath \
            -ldflags "-s -w -X main.pluginVersion=$VERSION" \
            -buildvcs=false -o dist/u1s1.so .

      - name: Verify glibc compatibility (must be ≤ 2.36)
        run: scripts/glibc-check.sh

      - name: Run unit tests
        run: go test ./...

      - name: Checksums
        run: |
          sha256sum dist/u1s1.so > dist/u1s1.so.sha256
          cat dist/u1s1.so.sha256

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/u1s1.so
            dist/u1s1.so.sha256
          generate_release_notes: true
