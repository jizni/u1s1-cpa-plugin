name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # go.mod 声明 go 1.27，直接跟随 go.mod 的版本
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build (c-shared)
        run: CGO_ENABLED=1 go build -buildmode=c-shared -trimpath -o u1s1-ci.so .

      - name: Unit tests
        run: go test ./...

      - name: Race detector
        run: CGO_ENABLED=1 go test -race ./...

      - name: Vet
        run: go vet ./...
